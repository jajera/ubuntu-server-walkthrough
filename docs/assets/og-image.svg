<?xml version="1.0" encoding="UTF-8"?>
<!-- Circle of Friends: Canonical Ltd. (Ubuntu brand). Used to identify Ubuntu Server. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Ubuntu Server walkthrough"
     font-family="Outfit, IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0c"/>
      <stop offset="0.55" stop-color="#120a08"/>
      <stop offset="1" stop-color="#0a0708"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E95420" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="980" cy="315" r="300" fill="url(#og-glow)"/>

  <text x="72" y="112" font-family="IBM Plex Mono, ui-monospace, monospace"
        font-size="26" font-weight="600" letter-spacing="3" fill="#22d3ee">UBUNTU SERVER - ISO TO SSH</text>

  <text x="70" y="210" font-size="64" font-weight="700" fill="#f4f6f8">Ubuntu Server</text>
  <text x="70" y="288" font-size="64" font-weight="700" fill="#f4f6f8">walkthrough</text>

  <text x="72" y="360" font-size="28" font-weight="400" fill="#c3cbd2">From live ISO to an SSH-reachable host -</text>
  <text x="72" y="400" font-size="28" font-weight="400" fill="#c3cbd2">generic bare-metal prep for other labs.</text>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="500">
    <g>
      <rect x="72" y="470" width="90" height="44" rx="22" fill="none" stroke="#E95420" stroke-width="1.5"/>
      <text x="117" y="499" fill="#f5b89a" text-anchor="middle">ISO</text>
    </g>
    <g>
      <rect x="178" y="470" width="100" height="44" rx="22" fill="none" stroke="#E95420" stroke-width="1.5"/>
      <text x="228" y="499" fill="#f5b89a" text-anchor="middle">USB</text>
    </g>
    <g>
      <rect x="294" y="470" width="150" height="44" rx="22" fill="none" stroke="#E95420" stroke-width="1.5"/>
      <text x="369" y="499" fill="#f5b89a" text-anchor="middle">Subiquity</text>
    </g>
    <g>
      <rect x="460" y="470" width="100" height="44" rx="22" fill="none" stroke="#E95420" stroke-width="1.5"/>
      <text x="510" y="499" fill="#f5b89a" text-anchor="middle">SSH</text>
    </g>
  </g>

  <text x="72" y="568" font-family="IBM Plex Mono, ui-monospace, monospace"
        font-size="24" font-weight="500" fill="#7c8994">ubuntu-server-walkthrough.johna.kiwi</text>

  <!-- Official Circle of Friends (Canonical CoF-2022 solid) -->
